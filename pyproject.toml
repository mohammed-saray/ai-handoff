[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-handoff"
version = "0.1.0"
description = "Hit a usage limit mid-task? Generate a handoff file and prompt to continue in Claude, Codex, Gemini or ChatGPT without losing context."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mohammed Al-Saray"}]
keywords = ["claude-code", "codex", "gemini-cli", "chatgpt", "handoff", "usage-limit", "context", "agents", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/mohammed2345353/ai-handoff"
Issues = "https://github.com/mohammed2345353/ai-handoff/issues"

[project.scripts]
ai-handoff = "ai_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
